<div class="workout-page fade-in">
    <div class="layout-container">
        <!-- Top Header & Horizontal Navigation -->
        <header class="page-top-header glass-panel">
            <div class="header-main-info">
                <div class="header-title-group">
                    <div class="page-icon-badge">
                        <lucide-icon [img]="Dumbbell" [size]="24"></lucide-icon>
                    </div>
                    <div>
                        <h1 class="page-title">Workout Station</h1>
                        <p class="page-subtitle">Train smarter, build strength & reach peak performance</p>
                    </div>
                </div>

                <div class="workout-quick-badges">
                    <div class="badge-item glass-card">
                        <lucide-icon [img]="Activity" [size]="16" class="icon-accent"></lucide-icon>
                        <span><strong>{{ todayCaloriesBurned() }}</strong> kcal burned</span>
                    </div>
                    <div class="badge-item glass-card">
                        <lucide-icon [img]="TrendingUp" [size]="16" class="icon-lime"></lucide-icon>
                        <span><strong>{{ weeklyWorkouts() }}</strong> workouts this week</span>
                    </div>
                </div>
            </div>

            <!-- Sub-Nav Pills -->
            <nav class="subnav-pills">
                <button class="pill-btn" [class.active]="currentView() === 'schedule'" (click)="showSchedule()" aria-label="View weekly schedule">
                    <lucide-icon [img]="CalendarDays" [size]="18"></lucide-icon>
                    <span>Weekly Schedule</span>
                </button>
                <button class="pill-btn" [class.active]="currentView() === 'routines' || currentView() === 'routine-builder'" (click)="showRoutines()" aria-label="My workout routines">
                    <lucide-icon [img]="ListChecks" [size]="18"></lucide-icon>
                    <span>My Routines</span>
                </button>
                <button class="pill-btn" [class.active]="currentView() === 'categories'" (click)="showCategories()" aria-label="Browse exercise categories">
                    <lucide-icon [img]="Dumbbell" [size]="18"></lucide-icon>
                    <span>Exercise Library</span>
                </button>
                <button class="pill-btn" [class.active]="currentView() === 'generator'" (click)="showGenerator()" aria-label="Generate workout plan">
                    <lucide-icon [img]="Sparkles" [size]="18"></lucide-icon>
                    <span>Generate Plan</span>
                </button>
                <button class="pill-btn" [class.active]="currentView() === 'history'" (click)="showHistory()" aria-label="View workout history">
                    <lucide-icon [img]="History" [size]="18"></lucide-icon>
                    <span>History</span>
                </button>
            </nav>
        </header>

        <!-- Main Content Area -->
        <main class="workout-main">
            <!-- Session View (Overlay) -->
            <app-workout-session *ngIf="isSessionActive()" (sessionEnded)="endWorkoutSession($event)"></app-workout-session>

            <ng-container *ngIf="!isSessionActive()">
                <div class="view-container fade-in">
                    <app-weekly-schedule *ngIf="currentView() === 'schedule'" (workoutStarted)="startWorkoutSession()"></app-weekly-schedule>
                    <app-routine-list *ngIf="currentView() === 'routines'"
                        (createRoutine)="showRoutineBuilder()"
                        (editRoutine)="onEditRoutine($event)"
                        (previewRoutine)="onPreviewRoutineFromList($event)">
                    </app-routine-list>
                    <app-routine-builder *ngIf="currentView() === 'routine-builder'"
                        [routine]="editingRoutine()"
                        [isPreview]="isPreviewMode()"
                        (saved)="onRoutineSaved()"
                        (cancelled)="onRoutineCancelled()"
                        (startDayWorkout)="onStartDayWorkout($event)">
                    </app-routine-builder>
                    <app-workout-history *ngIf="currentView() === 'history'"></app-workout-history>
                    <app-workout-plan-generator *ngIf="currentView() === 'generator'" (planGenerated)="onPlanGenerated()"></app-workout-plan-generator>
                    <app-exercise-list *ngIf="currentView() === 'categories'" [selectedCategory]="selectedCategory()"
                        (categorySelected)="selectCategory($event)" (startSession)="startWorkoutSession()" 
                        (addToRoutineEvent)="onAddExerciseToRoutine($event)">
                    </app-exercise-list>
                </div>
            </ng-container>
        </main>
    </div>
</div>
