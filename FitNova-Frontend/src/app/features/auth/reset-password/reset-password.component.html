<div class="auth-page fade-in">
    <div class="auth-card glass-panel">
        <div class="auth-header">
            <img src="images/fitnova-logo-main.png" alt="FitNova" class="auth-logo">
            <h2 class="text-gradient">Reset Password</h2>
            <p>Enter your new password below</p>
        </div>

        <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="auth-form" *ngIf="!successMessage">
            <!-- Server Error Message -->
            <div *ngIf="errorMessage" class="error-alert">
                <p>{{ errorMessage }}</p>
            </div>

            <div class="form-group">
                <label>New Password</label>
                <div class="input-wrapper">
                    <lucide-icon [img]="Lock" [size]="18" class="input-icon"></lucide-icon>
                    <input type="password" formControlName="password" placeholder="Enter new password" [class.input-error]="resetPasswordForm.get('password')?.invalid && resetPasswordForm.get('password')?.touched">
                </div>
                <span *ngIf="resetPasswordForm.get('password')?.invalid && resetPasswordForm.get('password')?.touched" class="field-error">Password must be at least 6 characters</span>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <div class="input-wrapper">
                    <lucide-icon [img]="Lock" [size]="18" class="input-icon"></lucide-icon>
                    <input type="password" formControlName="confirmPassword" placeholder="Confirm new password" [class.input-error]="resetPasswordForm.hasError('mismatch') && resetPasswordForm.get('confirmPassword')?.touched">
                </div>
                <span *ngIf="resetPasswordForm.hasError('mismatch') && resetPasswordForm.get('confirmPassword')?.touched" class="field-error">Passwords do not match</span>
            </div>

            <button type="submit" class="btn-primary btn-block" [disabled]="isLoading || resetPasswordForm.invalid">
                <span *ngIf="!isLoading">Reset Password</span>
                <span *ngIf="isLoading">Resetting...</span>
            </button>
        </form>

        <div *ngIf="successMessage" class="success-alert" style="background-color: rgba(46, 204, 113, 0.1); border: 1px solid var(--success-color); border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 20px;">
            <p style="color: var(--success-color); margin: 0; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <lucide-icon [img]="CheckCircle" [size]="20"></lucide-icon>
                {{ successMessage }}
            </p>
        </div>

        <div class="auth-footer" *ngIf="successMessage">
            <p><a routerLink="/auth/login" class="btn-primary" style="display: inline-block; padding: 10px 20px; color: white; text-decoration: none; border-radius: 8px;">Go to Login</a></p>
        </div>
    </div>
</div>
