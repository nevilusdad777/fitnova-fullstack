<div class="auth-page fade-in">
    <div class="auth-card glass-panel">
        <div class="auth-header">
            <img src="images/fitnova-logo-main.png" alt="FitNova" class="auth-logo">
            <h2 class="text-gradient">Forgot Password</h2>
            <p>Enter your email to receive a password reset link</p>
        </div>

        <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="auth-form" *ngIf="!successMessage">
            <!-- Server Error Message -->
            <div *ngIf="errorMessage" class="error-alert">
                <p>{{ errorMessage }}</p>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <lucide-icon [img]="Mail" [size]="18" class="input-icon"></lucide-icon>
                    <input type="email" formControlName="email" placeholder="name@example.com" [class.input-error]="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched">
                </div>
                <span *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched" class="field-error">Valid email is required</span>
            </div>

            <button type="submit" class="btn-primary btn-block" [disabled]="isLoading || forgotPasswordForm.invalid">
                <span *ngIf="!isLoading">Send Reset Link</span>
                <span *ngIf="isLoading">Sending...</span>
            </button>
        </form>

        <div *ngIf="successMessage" class="success-alert" style="background-color: rgba(46, 204, 113, 0.1); border: 1px solid var(--success-color); border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 20px;">
            <p style="color: var(--success-color); margin: 0; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <lucide-icon [img]="CheckCircle" [size]="20"></lucide-icon>
                {{ successMessage }}
            </p>
        </div>

        <div class="auth-footer">
            <p>Remember your password? <a routerLink="/auth/login">Sign In</a></p>
        </div>
    </div>
</div>
