<div class="form-container">
  <div class="page-header">
    <div class="header-content">
      <h2>{{ isEditMode ? 'Edit Food' : 'Add New Food' }}</h2>
      <p>{{ isEditMode ? 'Update existing food details' : 'Create a new food record' }}</p>
    </div>
    <button [routerLink]="['/admin/foods']" class="btn-back">← Back to List</button>
  </div>

  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>Loading food details...</p>
  </div>

  <div *ngIf="error" class="error">{{ error }}</div>

  <form *ngIf="!loading" [formGroup]="foodForm" (ngSubmit)="onSubmit()" class="food-form">
    
    <!-- Basic Information -->
    <div class="form-section">
      <h3>Basic Information</h3>
      
      <div class="form-grid">
        <div class="form-group span-2">
          <label for="name">Food Name *</label>
          <input type="text" id="name" formControlName="name" placeholder="e.g., Apple, Chicken Breast">
          <span class="error-msg" *ngIf="isFieldInvalid('name')">Food name is required</span>
        </div>

        <div class="form-group">
          <label for="category">Category *</label>
          <select id="category" formControlName="category">
            <option *ngFor="let cat of categories" [value]="cat">{{ cat | titlecase }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="apiSource">Data Source</label>
          <select id="apiSource" formControlName="apiSource">
            <option *ngFor="let source of apiSources" [value]="source">{{ source }}</option>
          </select>
        </div>

        <div class="form-group span-2">
          <label for="description">Description</label>
          <textarea id="description" formControlName="description" rows="3" placeholder="Optional description..."></textarea>
        </div>
      </div>

      <div class="checkbox-group mt-16">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="isVegetarian">
          <span class="checkbox-text">Is Vegetarian</span>
        </label>
        
        <label class="checkbox-label">
          <input type="checkbox" formControlName="verified">
          <span class="checkbox-text">Verified Record</span>
        </label>
      </div>
    </div>

    <!-- Macronutrients & Serving -->
    <div class="form-section mt-24">
      <h3>Macronutrients & Serving</h3>
      
      <div class="form-grid">
        <div class="form-group">
          <label for="servingSize">Serving Size *</label>
          <input type="number" id="servingSize" formControlName="servingSize">
        </div>

        <div class="form-group">
          <label for="servingUnit">Serving Unit *</label>
          <select id="servingUnit" formControlName="servingUnit">
            <option *ngFor="let unit of servingUnits" [value]="unit">{{ unit }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="calories">Calories (kcal) *</label>
          <input type="number" id="calories" formControlName="calories">
        </div>

        <div class="form-group">
          <label for="protein">Protein (g) *</label>
          <input type="number" id="protein" formControlName="protein" step="0.1">
        </div>

        <div class="form-group">
          <label for="carbs">Carbs (g) *</label>
          <input type="number" id="carbs" formControlName="carbs" step="0.1">
        </div>

        <div class="form-group">
          <label for="fat">Fat (g) *</label>
          <input type="number" id="fat" formControlName="fat" step="0.1">
        </div>
        
        <div class="form-group">
          <label for="fiber">Fiber (g)</label>
          <input type="number" id="fiber" formControlName="fiber" step="0.1">
        </div>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="form-actions mt-32">
      <button type="button" [routerLink]="['/admin/foods']" class="btn-cancel">Cancel</button>
      <button type="submit" class="btn-submit" [disabled]="submitting">
        {{ submitting ? 'Saving...' : (isEditMode ? 'Update Food' : 'Create Food') }}
      </button>
    </div>

  </form>
</div>
