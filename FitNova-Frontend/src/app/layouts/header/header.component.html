<!-- FitNova — Left Sidebar Navigation -->
<aside class="sidebar glass-panel" [class.mobile-open]="isMobileMenuOpen()">

    <!-- Logo -->
    <div class="sidebar-brand">
        <a routerLink="/home" class="brand-link" (click)="closeMobileMenu()">
            <img src="images/fitnova-logo-main.png" alt="FitNova" class="brand-logo">
            <span class="brand-name">FitNova</span>
        </a>
    </div>

    <!-- Main Navigation -->
    <nav class="sidebar-nav" aria-label="Main navigation">
        <a *ngFor="let item of navItems"
           [routerLink]="item.path"
           routerLinkActive="active"
           class="nav-item"
           (click)="closeMobileMenu()"
           [title]="item.label">
            <div class="nav-icon-wrapper">
                <lucide-icon [img]="item.icon" [size]="20"></lucide-icon>
            </div>
            <span class="nav-label">{{ item.label }}</span>
            <div class="nav-active-bar"></div>
        </a>
    </nav>

    <!-- Spacer -->
    <div class="sidebar-spacer"></div>

    <!-- Bottom Actions -->
    <div class="sidebar-bottom">
        <!-- Theme Toggle -->
        <button class="sidebar-action-btn" (click)="toggleTheme()"
            [title]="isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
            <div class="nav-icon-wrapper">
                <lucide-icon [img]="isDarkMode() ? Sun : Moon" [size]="20"></lucide-icon>
            </div>
            <span class="nav-label">{{ isDarkMode() ? 'Light Mode' : 'Dark Mode' }}</span>
        </button>

        <!-- User Profile -->
        <a routerLink="/profile" class="sidebar-user-card" (click)="closeMobileMenu()">
            <img *ngIf="profilePicture()" [src]="profilePicture()" alt="Profile" class="user-avatar-img">
            <div *ngIf="!profilePicture()" class="user-avatar">
                <span>{{ userInitials() }}</span>
            </div>
            <div class="user-info">
                <span class="user-name">{{ userName() }}</span>
                <span class="user-role">View Profile</span>
            </div>
        </a>
    </div>
</aside>

<!-- Mobile Top Bar -->
<header class="mobile-topbar glass-panel">
    <a routerLink="/home" class="brand-link" (click)="closeMobileMenu()">
        <img src="images/fitnova-logo-main.png" alt="FitNova" class="brand-logo">
        <span class="brand-name">FitNova</span>
    </a>
    <div class="mobile-topbar-actions">
        <button class="icon-btn" (click)="toggleTheme()">
            <lucide-icon [img]="isDarkMode() ? Sun : Moon" [size]="20"></lucide-icon>
        </button>
        <a routerLink="/profile" class="mobile-avatar">
            <img *ngIf="profilePicture()" [src]="profilePicture()" alt="Profile" class="user-avatar-img-sm">
            <div *ngIf="!profilePicture()" class="user-avatar-sm">{{ userInitials() }}</div>
        </a>
    </div>
</header>

<!-- Mobile Bottom Tab Bar -->
<nav class="mobile-tabbar glass-panel" aria-label="Mobile navigation">
    <a *ngFor="let item of navItems"
       [routerLink]="item.path"
       routerLinkActive="tab-active"
       class="tab-item">
        <lucide-icon [img]="item.icon" [size]="22"></lucide-icon>
        <span class="tab-label">{{ item.shortLabel }}</span>
    </a>
    <a routerLink="/profile" routerLinkActive="tab-active" class="tab-item">
        <lucide-icon [img]="User" [size]="22"></lucide-icon>
        <span class="tab-label">Profile</span>
    </a>
</nav>
